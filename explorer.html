м д<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Diora Blockchain Explorer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        header {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 1rem 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 0;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-indicator {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .status-dot {
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .online { background: #10b981; }
        .offline { background: #ef4444; }

        .refresh-btn {
            padding: 0.5rem 1rem;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .refresh-btn:hover { background: #2563eb; }

        .stats {
            padding: 2rem;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-bottom: 1px solid #334155;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
        }

        .stat-card {
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #3b82f6;
        }

        .stat-label {
            color: #94a3b8;
            font-size: 0.875rem;
        }

        main {
            padding: 2rem 0;
        }

        section {
            margin-bottom: 3rem;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
            color: #f8fafc;
        }

        .grid {
            display: grid;
            gap: 1rem;
        }

        .transactions-grid {
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        }

        .blocks-grid {
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            padding: 1rem;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: #3b82f6;
        }

        .transaction-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .address {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: #94a3b8;
        }

        .address-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .from-dot { background: #10b981; }
        .to-dot { background: #ef4444; }

        .amount {
            font-size: 1.125rem;
            font-weight: bold;
            color: #10b981;
        }

        .time {
            font-size: 0.75rem;
            color: #64748b;
        }

        .block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .block-number {
            font-size: 0.875rem;
            color: #94a3b8;
            font-weight: 600;
        }

        .block-data {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 0.375rem;
            padding: 0.75rem;
            font-family: monospace;
            font-size: 0.75rem;
            word-break: break-all;
        }

        .data-label {
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }

        .hash {
            margin-top: 0.75rem;
            font-size: 0.75rem;
            color: #64748b;
        }

        .hash-label {
            color: #94a3b8;
            margin-bottom: 0.25rem;
        }

        .hash-value {
            font-family: monospace;
            word-break: break-all;
            color: #3b82f6;
        }

        footer {
            background: #1e293b;
            border-top: 1px solid #334155;
            padding: 2rem;
            text-align: center;
            color: #94a3b8;
            font-size: 0.875rem;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #3b82f6;
            border-top: 4px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="loading" class="loading">
        <div style="text-align: center;">
            <div class="spinner"></div>
            <p style="margin-top: 1rem; color: #94a3b8;">Loading Diora Explorer...</p>
        </div>
    </div>

    <div id="app" class="hidden">
        <header>
            <div class="header-content">
                <h1>🔍 Diora Explorer</h1>
                <div class="status-indicator">
                    <div id="status" class="status-dot offline">● Offline</div>
                    <button onclick="fetchData()" class="refresh-btn">🔄 Refresh</button>
                </div>
            </div>
        </header>

        <div class="stats" id="stats" class="hidden">
            <div class="container">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div id="blocks-count" class="stat-number">0</div>
                        <div class="stat-label">Blocks</div>
                    </div>
                    <div class="stat-card">
                        <div id="transactions-count" class="stat-number">0</div>
                        <div class="stat-label">Transactions</div>
                    </div>
                    <div class="stat-card">
                        <div id="last-block" class="stat-number">#0</div>
                        <div class="stat-label">Last Block</div>
                    </div>
                </div>
            </div>
        </div>

        <main class="container">
            <section>
                <h2>💸 Recent Transactions</h2>
                <div id="transactions" class="grid transactions-grid">
                    <!-- Transactions will be loaded here -->
                </div>
            </section>

            <section>
                <h2>🧱 Recent Blocks</h2>
                <div id="blocks" class="grid blocks-grid">
                    <!-- Blocks will be loaded here -->
                </div>
            </section>
        </main>

        <footer>
            <p>🚀 Diora Blockchain Explorer - Real-time Transaction Monitor</p>
            <p style="margin-top: 0.5rem;">
                Connected to <span style="color: #3b82f6; font-weight: 600;">http://localhost:8080</span>
            </p>
        </footer>
    </div>

    <script>
        let blocks = [];
        let transactions = [];
        let status = null;

        function formatAddress(address) {
            return `${address.slice(0, 6)}...${address.slice(-4)}`;
        }

        function formatAmount(amount) {
            const eth = (parseInt(amount) / 1e18).toFixed(4);
            return `${eth} ETH`;
        }

        function formatTime(timestamp) {
            return new Date(timestamp).toLocaleString();
        }

        function createTransactionCard(tx, index) {
            return `
                <div class="card">
                    <div class="transaction-header">
                        <div class="address">
                            <div class="address-dot from-dot"></div>
                            <span>${formatAddress(tx.from)}</span>
                        </div>
                        <div class="amount">${formatAmount(tx.amount)}</div>
                    </div>
                    <div class="transaction-header">
                        <div class="address">
                            <div class="address-dot to-dot"></div>
                            <span>${formatAddress(tx.to)}</span>
                        </div>
                        <div class="time">${formatTime(tx.timestamp)}</div>
                    </div>
                </div>
            `;
        }

        function createBlockCard(block, index) {
            return `
                <div class="card">
                    <div class="block-header">
                        <span class="block-number">Block #${block.index}</span>
                        <div class="time">${formatTime(block.timestamp)}</div>
                    </div>
                    <div class="block-data">
                        <div class="data-label">Data:</div>
                        <div>${block.data}</div>
                    </div>
                    <div class="hash">
                        <div class="hash-label">Hash:</div>
                        <div class="hash-value">${block.hash}</div>
                    </div>
                </div>
            `;
        }

        async function fetchData() {
            try {
                const [statusRes, blocksRes, txRes] = await Promise.all([
                    fetch('http://localhost:8080/api/status'),
                    fetch('http://localhost:8080/api/blocks'),
                    fetch('http://localhost:8080/api/transactions')
                ]);

                if (!statusRes.ok || !blocksRes.ok || !txRes.ok) {
                    throw new Error('API request failed');
                }

                status = await statusRes.json();
                const blocksData = await blocksRes.json();
                const transactionsData = await txRes.json();

                console.log('Fetched data:', { status, blocks: blocksData, transactions: transactionsData });
                updateUI(status, blocksData.blocks || [], transactionsData.transactions || []);
            } catch (error) {
                console.error('Error fetching data:', error);
                const statusEl = document.getElementById('status');
                statusEl.textContent = '● Error';
                statusEl.className = 'status-dot offline';
                
                // Show error message
                const loadingEl = document.getElementById('loading');
                const appEl = document.getElementById('app');
                if (loadingEl && appEl) {
                    loadingEl.classList.add('hidden');
                    appEl.classList.remove('hidden');
                    document.getElementById('stats').classList.remove('hidden');
                    
                    // Show error in stats
                    document.getElementById('blocks-count').textContent = 'Error';
                    document.getElementById('transactions-count').textContent = 'Error';
                    document.getElementById('last-block').textContent = 'Error';
                }
            }
        }

        function updateUI(statusData, blocksData, transactionsData) {
            // Update status
            const statusEl = document.getElementById('status');
            statusEl.textContent = statusData.status === 'running' ? '● Online' : '● Offline';
            statusEl.className = `status-dot ${statusData.status === 'running' ? 'online' : 'offline'}`;

            // Update stats
            document.getElementById('blocks-count').textContent = statusData.blocks;
            document.getElementById('transactions-count').textContent = transactionsData.length;
            document.getElementById('last-block').textContent = `#${statusData.last_block ? statusData.last_block.index : '#0'}`;

            // Update transactions
            const transactionsEl = document.getElementById('transactions');
            const recentTransactions = transactionsData.slice(-6).reverse();
            transactionsEl.innerHTML = recentTransactions.map((tx, index) => createTransactionCard(tx, index)).join('');

            // Update blocks
            const blocksEl = document.getElementById('blocks');
            const recentBlocks = blocksData.slice(-6).reverse();
            blocksEl.innerHTML = recentBlocks.map((block, index) => createBlockCard(block, index)).join('');

            // Show app, hide loading
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('stats').classList.remove('hidden');
        }

        // Initial load
        fetchData();

        // Auto-refresh every 5 seconds
        setInterval(fetchData, 5000);
    </script>
</body>
</html>
